name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # main.go embeds frontend/dist, so it must exist before linting/testing.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # gofmt, go vet, errcheck, staticcheck, ... (see .golangci.yml)
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: go test
        run: go test -race -tags webkit2_41 ./...

  ui-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The browsers are cached per Playwright version; their system
      # libraries come from apt every time.
      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps webkit chromium

      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps webkit chromium

      # Builds the frontend and runs it against the fake backend in WebKit
      # (the engine of WebKitGTK/WKWebView) and Chromium (close to WebView2).
      - name: UI tests
        working-directory: frontend
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
