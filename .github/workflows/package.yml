name: Package

on:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.1

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            asset: Linux_x86_64.tar.gz
          - os: macos-14
            platform: darwin/universal
            asset: Darwin_universal.dmg
          - os: windows-latest
            platform: windows/amd64
            asset: Windows_x86_64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      ASSET: Wombat_${{ github.ref_name }}_${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # The version shown in the macOS bundle and Windows file properties.
      - name: Set product version
        run: node -e 'const f="wails.json",j=JSON.parse(require("fs").readFileSync(f));j.info.productVersion=process.env.TAG.replace(/^v/,"");require("fs").writeFileSync(f,JSON.stringify(j,null,2))'

      - name: Build
        run: wails build -clean -platform ${{ matrix.platform }} -ldflags "-X wombat/internal/app.semver=${TAG}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C build/bin -zcvf "$ASSET" wombat

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Wombat" \
            --volicon "assets/darwin/dmg_icon.icns" \
            --background "assets/darwin/dmg_bg.png" \
            --window-size 512 360 \
            --icon-size 100 \
            --icon "Wombat.app" 100 185 \
            --hide-extension "Wombat.app" \
            --app-drop-link 388 185 \
            "$ASSET" build/bin

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/wombat.exe -DestinationPath $env:ASSET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release text is the tag's section of CHANGELOG.md
      # ("## [v0.6.0] - 2026-11-13"), plus a link to it.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          heading=$(grep -m1 -E "^## \[${TAG}\]" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::CHANGELOG.md has no '## [${TAG}]' section"
            exit 1
          fi
          # GitHub's heading anchor: lower case, punctuation removed, spaces -> '-'.
          anchor=$(echo "${heading#\#\# }" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9 -]//g; s/ /-/g')
          awk -v h="$heading" '$0 == h {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          printf '\nFull changelog ⇒ [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md#%s)\n' \
            "$SERVER" "$REPO" "$TAG" "$anchor" >> notes.md

      # Tags with a suffix (v0.6.0-rc1, v0.6.0-beta.2) are pre-releases, which
      # the in-app update check (releases/latest) does not offer.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
